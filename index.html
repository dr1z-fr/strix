<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRIX // SECURE TERMINAL</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="tablet-boot">

  <!-- Status bar tablette -->
  <header class="tab-statusbar">
    <span class="tab-statusbar-brand">STRIX</span>
    <div class="tab-statusbar-meta">
      <span class="tab-statusbar-secure"><i class="dot"></i> SECURE</span>
      <span id="bootClock">--:--</span>
    </div>
  </header>

  <!-- Lockscreen -->
  <main class="tab-lockscreen">
    <div class="tab-lockscreen-inner">
      <!-- Logo + clock -->
      <div class="tab-brand-block">
        <img src="strix-logo.png" alt="" class="tab-brand-img" />
        <div id="bootTime" class="tab-brand-time">--:--</div>
        <div id="bootDate" class="tab-brand-date">—</div>
      </div>

      <!-- Carte minimaliste -->
      <section class="tab-loginbox">
        <p class="tab-loginbox-tag">Authentification requise</p>
        <form id="loginForm" autocomplete="off" class="tab-loginbox-form">
          <input type="text" id="username" name="username" placeholder="Nom de code" required autocomplete="username" />
          <input type="password" id="password" name="password" placeholder="Code d'accès" required autocomplete="current-password" />
          <label class="tab-remember">
            <input type="checkbox" id="remember" />
            <span>Mémoriser</span>
          </label>
          <button type="submit" class="tab-unlock-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            Déverrouiller
          </button>
          <p id="loginError" class="tab-error" hidden></p>
        </form>
      </section>
    </div>
  </main>

  <script>
    // Live clocks for the boot screen
    (function bootClocks() {
      function tick() {
        const d = new Date();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        const t = document.getElementById('bootTime');
        const dd = document.getElementById('bootDate');
        const bc = document.getElementById('bootClock');
        if (t)  t.textContent  = `${hh}:${mm}`;
        if (bc) bc.textContent = `${hh}:${mm}:${ss}`;
        if (dd) dd.textContent = d.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      }
      tick(); setInterval(tick, 1000);
    })();
  </script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
